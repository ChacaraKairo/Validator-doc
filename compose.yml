services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: validator_doc
      POSTGRES_USER: validator_doc
      POSTGRES_PASSWORD: validator_doc
    ports:
      - "5432:5432"
    volumes:
      - validator_doc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator_doc -d validator_doc"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - validator_doc_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  validator_doc_postgres:
  validator_doc_minio:
