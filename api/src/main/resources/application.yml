spring:
  application:
    name: validator-doc-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/validator_doc}
    username: ${DB_USERNAME:validator_doc}
    password: ${DB_PASSWORD:validator_doc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
