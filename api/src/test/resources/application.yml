spring:
  datasource:
    url: jdbc:h2:mem:validator_doc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
validator:
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: validator-doc-test
app:
  clamav:
    host: localhost
    port: 3310
    timeout-millis: 1000
    enabled: false
  outbox:
    publish-delay-ms: 3600000
